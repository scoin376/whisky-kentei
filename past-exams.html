<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><title>公式過去問｜ウイスキー検定1級</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}header{position:sticky;top:0;z-index:10;background:#171717;color:#fff;padding:13px 16px}header h1{font-size:18px;margin:0}main{max-width:720px;margin:auto;padding:14px}.panel,.q{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modes button,.nav button,.ans button,.action{border:1px solid #d7d2cb;background:#fff;border-radius:11px;padding:12px;font-weight:700}.modes button.active,.ans button.sel{background:#222;color:#fff}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:#eee5da;border-radius:999px;padding:6px 10px;font-size:13px}.q h2{font-size:18px;line-height:1.55}.hint{font-size:13px;color:#666;line-height:1.6}.ans{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.ans button{font-size:18px}.action{width:100%;margin-top:10px;background:#222;color:#fff}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f7f2eb;font-weight:700}.written{width:100%;font-size:16px;padding:12px;border:1px solid #ccc;border-radius:10px}.nav{display:flex;gap:8px;margin-top:10px}.nav button{flex:1}.bad{color:#b22}.good{color:#287a39}.back{color:#fff;text-decoration:none;font-size:13px}.weak{border:2px solid #c99a3d}.note{font-size:12px;color:#777;margin-top:10px}</style></head><body><header><a class="back" href="./">‹ メインへ</a><h1>🥃 ウイスキー検定1級｜公式過去問</h1></header><main>
<div class="panel"><div class="modes"><button data-exam="18" class="active">第18回</button><button data-exam="20">第20回</button><button id="random">200問ランダム</button><button id="wrong">間違えた問題</button><button id="weak">苦手問題</button></div><div class="stats"><span class="pill" id="pos"></span><span class="pill" id="score"></span><span class="pill" id="wrongCount"></span></div></div>
<div id="root"></div></main><script src="past-exams-data.js"></script><script src="past-exams-questions.js"></script><script>
const KEY='whisky-official-exams-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let mode='exam',exam='18',order=[],idx=0;
const all=()=>['18','20'].flatMap(e=>Array.from({length:100},(_,i)=>({e,n:i+1})));
function rec(e,n){return state[e+'-'+n]||{attempts:0,correct:0,wrong:0,last:null}}
function save(e,n,ok){const k=e+'-'+n,r=rec(e,n);r.attempts++;ok?r.correct++:r.wrong++;r.last=Date.now();state[k]=r;localStorage.setItem(KEY,JSON.stringify(state))}
function buildOrder(){if(mode==='exam')order=Array.from({length:100},(_,i)=>({e:exam,n:i+1}));if(mode==='random')order=all().sort(()=>Math.random()-.5);if(mode==='wrong')order=all().filter(x=>rec(x.e,x.n).wrong>0);if(mode==='weak')order=all().filter(x=>rec(x.e,x.n).wrong>rec(x.e,x.n).correct);idx=0;render()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const root=document.getElementById('root');if(!order.length){root.innerHTML='<div class="panel">まだ復習対象の問題はありません 👍</div>';stats();return}const x=order[idx],d=EXAMS[x.e],r=rec(x.e,x.n),written=x.n>80,answer=written?d.written[x.n-81]:d.answers[x.n-1];const vd=window.EXAM_QUESTIONS?.[x.e]?.[x.n];const visualNote=vd?.visual?'<div class="result"><strong>🖼️ 図版問題</strong><br><span class="hint">この問題は元の問題冊子の写真・地図・グラフを参照する必要があります。現在、図版画像のアプリ内表示を準備中です。</span></div>':'';const qtext=written?d.writtenQ[x.n-81]:(vd?.q||'問題冊子の「第'+x.e+'回 Q'+String(x.n).padStart(3,'0')+'」を見て、正しい選択肢を選んでください。');let body;if(written){body='<input id="free" class="written" placeholder="答えを入力（自己採点でもOK）"><button class="action" id="reveal">答えを見る</button>'}else if(vd){body='<div class="ans" style="grid-template-columns:1fr">'+vd.o.map((o,i)=>'<button data-v="'+(i+1)+'">'+(i+1)+'. '+esc(o)+'</button>').join('')+'</div><button class="action" id="check">回答する</button>'}else{body='<div class="ans">'+[1,2,3,4,5].map(v=>'<button data-v="'+v+'">'+v+'</button>').join('')+'</div><button class="action" id="check">回答する</button>'}root.innerHTML='<section class="q '+(r.wrong>r.correct?'weak':'')+'"><div class="hint">第'+x.e+'回｜Q'+String(x.n).padStart(3,'0')+(r.attempts?'｜挑戦 '+r.attempts+'回・誤答 '+r.wrong+'回':'')+'</div><h2>'+esc(qtext)+'</h2>'+visualNote+body+'<div id="res"></div><div class="nav"><button id="prev">‹ 前へ</button><button id="next">次へ ›</button></div><div class="note">公式解答表を正解データとして登録。手書きの丸印は採点に使用していません。</div></section>';let selected=null;document.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ans button').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');selected=+b.dataset.v});const ck=document.getElementById('check');if(ck)ck.onclick=()=>{if(selected==null)return alert('答えを選んでね😊');const ok=selected===answer;save(x.e,x.n,ok);document.getElementById('res').innerHTML='<div class="result '+(ok?'good':'bad')+'">'+(ok?'⭕ 正解！':'❌ 不正解')+'　公式解答：'+answer+'</div>';stats()};const rv=document.getElementById('reveal');if(rv)rv.onclick=()=>{document.getElementById('res').innerHTML='<div class="result">公式解答：'+esc(answer)+'<br><span class="hint">自分の答えが合っていれば「正解」、違っていれば「不正解」を記録してください。</span><div class="nav"><button id="selfok">⭕ 正解</button><button id="selfng">❌ 不正解</button></div></div>';document.getElementById('selfok').onclick=()=>{save(x.e,x.n,true);stats()};document.getElementById('selfng').onclick=()=>{save(x.e,x.n,false);stats()}};document.getElementById('prev').onclick=()=>{idx=(idx-1+order.length)%order.length;render()};document.getElementById('next').onclick=()=>{idx=(idx+1)%order.length;render()};stats()}
function stats(){const done=order.filter(x=>rec(x.e,x.n).attempts>0).length,correct=order.reduce((s,x)=>s+rec(x.e,x.n).correct,0),wrong=order.reduce((s,x)=>s+rec(x.e,x.n).wrong,0);document.getElementById('pos').textContent=order.length?(idx+1)+' / '+order.length:'0 / 0';document.getElementById('score').textContent='正解 '+correct;document.getElementById('wrongCount').textContent='誤答 '+wrong}
document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-exam]').forEach(z=>z.classList.remove('active'));b.classList.add('active');mode='exam';exam=b.dataset.exam;buildOrder()});
document.getElementById('random').onclick=()=>{mode='random';buildOrder()};
document.getElementById('wrong').onclick=()=>{mode='wrong';buildOrder()};
document.getElementById('weak').onclick=()=>{mode='weak';buildOrder()};
buildOrder();
</script></body></html>
